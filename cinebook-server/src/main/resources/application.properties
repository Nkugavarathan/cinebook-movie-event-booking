spring.application.name=cinebook

# Secrets (Stripe keys, DB password, JWT secret) live in cinebook-server/.env - see .env.example
spring.config.import=optional:file:.env[.properties],optional:file:cinebook-server/.env[.properties],optional:classpath:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinebook?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (24h)
jwt.secret=${JWT_SECRET:varathan_super_secret_key_1234567890abcd_change_me}
jwt.expiration=86400000

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# App
app.currency=${APP_CURRENCY:usd}
app.client-url=${CLIENT_URL:http://localhost:5173}
app.admin-url=${ADMIN_URL:http://localhost:5174}
# Minutes a seat stays reserved while the user completes checkout
app.booking.hold-minutes=10
app.booking.max-seats=10
# Default admin account created on first start
app.admin.email=${ADMIN_EMAIL:admin@cinebook.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
# Seed demo movies/theaters/showtimes when the database is empty
app.seed-demo-data=${SEED_DEMO_DATA:true}

# The IDE recompiles into target/ too; auto-restart mid-compile causes ClassNotFound errors
spring.devtools.restart.enabled=false
