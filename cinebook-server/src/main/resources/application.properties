spring.application.name=cinebook

# Secrets (Stripe keys, DB password, JWT secret) live in cinebook-server/.env - see .env.example
spring.config.import=optional:file:.env[.properties],optional:file:cinebook-server/.env[.properties],optional:classpath:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinebook?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (24h)
jwt.secret=${JWT_SECRET:varathan_super_secret_key_1234567890abcd_change_me}
jwt.expiration=86400000

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# App
# Currency for ticket prices and Stripe Checkout: lkr (default) or usd, inr, eur...
# Changing it does NOT convert existing showtime prices - re-price showtimes in the admin after switching.
app.currency=${APP_CURRENCY:lkr}
app.client-url=${CLIENT_URL:http://localhost:5173}
app.admin-url=${ADMIN_URL:http://localhost:5174}
# Minutes a seat stays reserved while the user completes checkout
app.booking.hold-minutes=10
app.booking.max-seats=10
# Default admin account created on first start
app.admin.email=${ADMIN_EMAIL:admin@cinebook.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
# Seed demo movies/theaters/showtimes when the database is empty
app.seed-demo-data=${SEED_DEMO_DATA:true}

# The IDE recompiles into target/ too; auto-restart mid-compile causes ClassNotFound errors
spring.devtools.restart.enabled=false

# Customers can cancel a paid ticket themselves until this many hours before the show
app.booking.refund-cutoff-hours=${REFUND_CUTOFF_HOURS:24}
# Cancellation fee kept from customer refunds (0 = full refund)
app.booking.refund-fee-percent=${REFUND_FEE_PERCENT:0}

# Email - ticket PDFs are sent after payment. Credentials come from .env (MAIL_USERNAME / MAIL_PASSWORD).
# For Gmail use an App Password (Google Account -> Security -> App passwords), not your normal password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
app.mail.from-name=${MAIL_FROM_NAME:CineBook}
