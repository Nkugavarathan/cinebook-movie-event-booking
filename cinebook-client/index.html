<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="description" content="Book movie tickets with live seat selection and secure Stripe payments." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved / system theme before React renders to avoid a flash.
      try {
        var t = localStorage.getItem("cinebook_theme") ||
          (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = "dark"
      }
    </script>
    <title>CineBook – Movie Tickets</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
